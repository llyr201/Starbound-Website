<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Explore the atmospheric narrative adventure game 'Slate City' from Starbound Game Labs.">
  <title>Slate City | Starbound Game Labs</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="site-header">
    <nav class="nav container">
      <a class="logo" href="home.html">Starbound <span>Game Labs</span></a>
      <div class="nav-links">
        <a class="nav-link" href="home.html">Home</a>
        <a class="nav-link active" href="projects.html">Projects</a>
        <a class="nav-link" href="about.html">About</a>
        <a class="nav-link" href="contact.html">Contact</a>
      </div>
      <button class="account sign-out" type="button">
        <span class="avatar">SB</span>
        <span class="account-label">Sign out</span>
      </button>
    </nav>
  </header>

  <main class="page-content container">
    <section class="section-head">
      <h1>Slate City</h1>
    <div class="slideshow-container">

      <!-- Full-width images with number and caption text -->
      <div class="mySlides fade">
        <div class="numbertext">1 / 3</div>
        <video width="100%" autoplay muted loop>
          <source src="/img/mov/slatevideo.mp4" type="video/mp4">
        </video>
        <div class="text">Caption Text</div>
      </div>

      <div class="mySlides fade">
        <img src="new Slate City Poster.svg" style="width:100%">
      </div>

      <div class="mySlides fade">
        <div class="numbertext">3 / 3</div>
        <img src="img3.jpg" style="width:100%">
        <div class="text">Caption Three</div>
      </div>

      <!-- Next and previous buttons -->
      <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
      <a class="next" onclick="plusSlides(1)">&#10095;</a>
    </div>
    <br>

    <!-- The dots/circles -->
    <div style="text-align:center">
      <span class="dot" onclick="currentSlide(1)"></span>
      <span class="dot" onclick="currentSlide(2)"></span>
      <span class="dot" onclick="currentSlide(3)"></span>
    </div>
    <script src="slideshow.js"></script>

    <section class="section-head">
      <h1>News</h1>
      <p>This is where you'll find the latest updates about Slate City.</p>
    </section>

  </main>
</body>

</html>
